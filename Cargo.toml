[package]
name = "rs_facetime"
version = "0.1.0"
edition = "2021"
description = "Unstable, still in development — FaceTime Audio private API bridge for macOS"
license = "MPL-2.0"
repository = "https://github.com/undivisible/rs_facetime"
readme = "README.md"
keywords = ["facetime", "macos", "telephony"]
categories = ["api-bindings", "os::macos-apis"]

[lib]
name = "rs_facetime"
path = "src/lib.rs"

[features]
default = []
private-api = ["dep:uuid"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"], optional = true }
