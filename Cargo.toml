[package]
name = "rs_facetime"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "Unstable, still in development — FaceTime Audio private API bridge for macOS"
license = "ISC"
repository = "https://github.com/undivisible/rs_facetime"
readme = "README.md"
keywords = ["facetime", "macos", "telephony"]
categories = ["api-bindings", "os::macos-apis"]

[lib]
name = "rs_facetime"
path = "src/lib.rs"

[[bin]]
name = "rs_facetime"
path = "src/bin/rs_facetime.rs"
required-features = ["cli"]

[[example]]
name = "audio_synthetic"
required-features = ["audio"]

[features]
default = []
audio = []
coreaudio-capture = ["audio"]
private-api = ["dep:uuid"]
cli = ["dep:clap", "dep:tracing-subscriber", "private-api"]

[dependencies]
clap = { version = "4", optional = true, features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
uuid = { version = "1", features = ["v4"], optional = true }
